name: API CI Pipeline

# 1. When should this run? Every time you push to the main branch.
on:
  push:
    branches: [ "main" ]

jobs:
  test-api:
    runs-on: ubuntu-latest # 2. Spin up a temporary Linux server

    steps:
    - name: Download your code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Speeds up installation

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx  # Packages needed strictly for testing

    - name: Run PyTest
      run: |
        pytest test_api.py